# Nexus OS —— Nginx 反向代理配置
# 落地位置：/etc/nginx/conf.d/nexus-os.conf
#
# 职责：对外接 80/443，把请求转给本机 3000 端口上运行的 Next.js 服务。
# 备案通过、证书就绪后，再把 443 段打开。

# 上游：本机的 Next.js 生产服务（由 systemd 守护）
upstream nexus_os {
    server 127.0.0.1:3000;
    keepalive 32;                 # 保持长连接，省掉反复握手的开销
}

# 压缩：Next.js 自托管时不会自动 gzip，交给 Nginx 做
gzip on;
gzip_proxied any;                 # 被代理的响应也要压缩
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json
           application/xml image/svg+xml;

server {
    listen 80;
    listen [::]:80;
    server_name nexusos.work www.nexusos.work;

    access_log /var/log/nginx/nexus-os.access.log;
    error_log  /var/log/nginx/nexus-os.error.log;

    # ── 备案通过 + 证书就绪后，取消下面这行注释，80 全部跳到 443 ──
    # return 301 https://$host$request_uri;

    # ── 构建产物：文件名带内容哈希，可以放心长缓存 ──
    location /_next/static/ {
        proxy_pass http://nexus_os;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── 其余请求全部转给 Next.js ──
    location / {
        proxy_pass http://nexus_os;
        proxy_http_version 1.1;
        proxy_set_header Connection "";          # 配合 upstream keepalive
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式响应（如 SSE）必须关掉缓冲，否则内容会被攒着一起发
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# ─────────────────────────────────────────────────────────────
# 阶段 C：备案通过后，用 certbot 或 acme.sh 申请证书，
# 然后在这里补一个 443 的 server 段（结构与 80 相同，加 ssl 相关指令），
# 并把 80 的 return 301 打开。
# ─────────────────────────────────────────────────────────────
