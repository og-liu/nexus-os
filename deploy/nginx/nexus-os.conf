# Nexus OS —— Nginx 反向代理配置
# 落地位置：/etc/nginx/conf.d/nexus-os.conf
#
# 职责：对外接 80/443，把请求转给本机 3000 端口上运行的 Next.js 服务。
#
# 域名：nexusos.work（主） / www.nexusos.work（301 到主域名）
# 证书：Let's Encrypt，用 acme.sh 签发，装到 /etc/nginx/ssl/ 下
#       acme.sh 每 60 天自动续期，续期后自动 reload nginx，无需人工干预。

# 上游：本机的 Next.js 生产服务（由 systemd 守护）
upstream nexus_os {
    server 127.0.0.1:3000;
    keepalive 32;                 # 保持长连接，省掉反复握手的开销
}

# 压缩：Next.js 自托管时不会自动 gzip，交给 Nginx 做
gzip on;
gzip_proxied any;                 # 被代理的响应也要压缩
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json
           application/xml image/svg+xml;

# ─────────────────────────────────────────────────────────────
# 80 端口：只做两件事 —— 放行证书验证、其余全部跳 HTTPS
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name nexusos.work www.nexusos.work;

    access_log /var/log/nginx/nexus-os.access.log;
    error_log  /var/log/nginx/nexus-os.error.log;

    # 证书验证目录。acme.sh 会把一个随机文件写进这里，Let's Encrypt 从外网来读。
    # 为什么不能直接 return 301：服务器级的 return 在 location 匹配之前就执行了，
    # 验证请求会被跳去 https，而这时证书还没签下来 —— 先有鸡还是先有蛋。
    # 所以用 location 单独放行，让它命中文件而不是跳转。
    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
        default_type "text/plain";
    }

    # 跳转目标写死主域名而不是 $host：这样直接敲 IP 访问也会被带回正式域名，
    # 而不是跳到 https://<IP>（那个地址的证书不匹配，浏览器会报红）。
    location / {
        return 301 https://nexusos.work$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────
# 443：www 子域统一 301 到主域名（避免同一份内容有两个网址）
# ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nexusos.work;

    ssl_certificate     /etc/nginx/ssl/nexusos.work.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/nexusos.work.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://nexusos.work$request_uri;
}

# ─────────────────────────────────────────────────────────────
# 443：主域名，正经服务
# ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nexusos.work;

    access_log /var/log/nginx/nexus-os.access.log;
    error_log  /var/log/nginx/nexus-os.error.log;

    # ── TLS ──
    ssl_certificate     /etc/nginx/ssl/nexusos.work.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/nexusos.work.key;
    # 只留 TLS 1.2/1.3：1.0 和 1.1 已被各大浏览器判死，留着只是攻击面
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;   # 现代做法：交给客户端挑（它的密码学实现更懂自己的硬件）
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 告诉浏览器「这个站只走 HTTPS，一年内别再试 http」。
    # 没有 includeSubDomains / preload：万一以后有子域要走 http 或被自有证书覆盖，不至于被锁死。
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ── 构建产物：文件名带内容哈希，可以放心长缓存 ──
    location /_next/static/ {
        proxy_pass http://nexus_os;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── 其余请求全部转给 Next.js ──
    location / {
        proxy_pass http://nexus_os;
        proxy_http_version 1.1;
        proxy_set_header Connection "";          # 配合 upstream keepalive
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式响应（如 SSE）必须关掉缓冲，否则内容会被攒着一起发
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
